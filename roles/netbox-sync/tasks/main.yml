######### Retrieve Config Contexts from NetBox ##########
- name: Obtain list of config contexts from NetBox
  uri:
    url: "{{ netbox_url }}/api/extras/config-contexts/"
    validate_certs: "{{ netbox_validate_certs | default(true) }}"
    method: GET
    timeout: 120
    headers:
      Authorization: 'Token {{ netbox_api_token }}'
  register: netbox_config_contexts_query
  run_once: true
  check_mode: no
  delegate_to: localhost
  tags:
    - always
    - contexts

- name: Set config contexts fact
  set_fact:
    nb_config_contexts: "{{ (netbox_config_contexts_query.json.results if (netbox_config_contexts_query is defined and netbox_config_contexts_query.json is defined) else []) }}"
  run_once: true
  tags:
    - always
    - contexts
###########################################################
