---
######### Retrieve MLAG Pairs from NetBox ###############
- name: Get NetBox mlag pairs
  uri:
    url: "{{ netbox_url }}/graphql/"
    validate_certs: "{{ netbox_validate_certs | default(true) }}"
    method: POST
    timeout: 120
    headers:
      Authorization: 'Token {{ netbox_api_token }}'
    body_format: json
    body:
      query: '{{ lookup("template", "roles/netbox-sync/templates/mlag_pairs.graphql") }}'
  register: netbox_mlag_pairs_query
  run_once: true
  check_mode: no
  tags:
    - always

- name: Set mlag_pairs fact
  set_fact:
    nb_mlag_pairs:
      virtual_chassis: "{{ netbox_mlag_pairs_query.json.data.virtual_chassis_list | default([]) | emil.nbavd.netbox_compat('virtual_chassis') }}"
  run_once: true
  tags:
    - always
###########################################################

